version: '3.1'

services:
  db:
    image: mysql:8.0
    container_name: recipe_mysql_app
    restart: always
    ports:
      - "3306:3306"
    environment:

      MYSQL_DATABASE: hambreCeroDB
      MYSQL_USER: hambre_user
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: